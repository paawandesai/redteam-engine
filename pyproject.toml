[project]
name = "redteam-engine"
version = "0.1.0"
description = "Adversarial penetration testing engine for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2.0", "langchain-core>=0.3.0", "langchain-anthropic>=0.3.0"]
openai = ["openai>=1.50.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0", "ruff>=0.5.0"]

[project.scripts]
redteam = "redteam.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redteam"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src"]
